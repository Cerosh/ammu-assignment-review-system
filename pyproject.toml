[project]
name = "ammu-assignment-review-system"
version = "0.1.0"
description = "AI-assisted assignment review system, built incrementally while learning LangChain."
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ammu_review"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
