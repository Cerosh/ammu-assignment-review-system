name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed to diff the push/PR range — the doc-staleness
          # guardrails below compare against the commit(s) before this push,
          # which a shallow (fetch-depth: 1) checkout can't do.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Determine doc-validation range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          else
            # First push to a new branch (or a force-push with no common
            # ancestor available) — nothing to diff against, skip.
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Doc-staleness guardrails
        if: steps.range.outputs.skip != 'true'
        run: |
          npm run validate:no-contradiction -- --range "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"
          npm run validate:sprint-doc-contact -- --range "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"
          npm run validate:doc-freshness -- --range "${{ steps.range.outputs.base }}" "${{ steps.range.outputs.head }}"

      - name: Sprint doc consistency
        run: npm run validate:sprint-consistency

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Lighthouse (report-only)
        id: lighthouse
        # Reports scores without blocking CI — no historical baseline exists yet to set
        # meaningful pass/fail thresholds against.
        continue-on-error: true
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 > /dev/null && break
            sleep 1
          done
          npx lighthouse http://localhost:3000 \
            --output=json --output-path=./lighthouse-report.json \
            --chrome-flags="--headless --no-sandbox" --quiet
          node -e "
            const r = require('./lighthouse-report.json');
            for (const c of Object.values(r.categories)) {
              console.log(c.title + ': ' + Math.round(c.score * 100));
            }
          "

      - name: Flag failed Lighthouse run
        # continue-on-error above hides a Lighthouse failure from the job's pass/fail
        # status (by design, so it never blocks CI) — this makes that failure visible
        # instead of silently producing no report run after run.
        if: steps.lighthouse.outcome == 'failure'
        run: echo "::warning::Lighthouse failed this run — no report generated. Check the step log above."

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 7

  e2e:
    # Chromium + Firefox only. WebKit is deliberately excluded here — its
    # Linux/CI build has repeatedly shown debounced-UI timing flakes on this
    # runner class that never reproduce locally (see .ai/TODO.md Backlog).
    # WebKit still runs in full locally (playwright.config.ts's 3 projects
    # are unchanged) and is enforced pre-push (.husky/pre-push), so it isn't
    # dropped from the quality bar — just moved off this specific runner.
    name: End-to-end tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: End-to-end tests
        run: npx playwright test --project=chromium --project=firefox --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  deploy:
    # Gates production on `checks` + `e2e` passing. Vercel's own Git integration
    # should have auto-deploy disabled for `main` (vercel.json's
    # git.deploymentEnabled.main set to false) so this job is the only path to
    # a production deployment.
    name: Deploy to Production
    needs: [checks, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pull Vercel environment
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        # Pinned to a major version (not a bare `vercel`) so a future CLI release can't
        # silently change deploy behavior between one production deploy and the next —
        # bump this deliberately, in its own commit, when ready to adopt a new major.
        run: npx vercel@58 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: npx vercel@58 build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact
        run: npx vercel@58 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
